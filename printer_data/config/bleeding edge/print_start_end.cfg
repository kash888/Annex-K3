
[gcode_macro _PRINT_VARIABLES]
variable_bed_temperature_initial_layer_single: 0.0
variable_nozzle_temperature_initial_layer: 0.0
#variable_chamber_temperature: 0.0
gcode:
  {% set reset = params.RESET | default(0) | int %}
  {% if reset %}
    SET_GCODE_VARIABLE MACRO=_PRINT_VARIABLES VARIABLE=bed_temperature_initial_layer_single VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_PRINT_VARIABLES VARIABLE=nozzle_temperature_initial_layer VALUE=0.0
    #SET_GCODE_VARIABLE MACRO=_PRINT_VARIABLES VARIABLE=chamber_temperature VALUE=0.0
  {% endif %}

[gcode_macro PRINT_START]
gcode:
  {% set BED_TEMP = params.BED_TEMP | default(100) | float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP | default(260) | float %}
  #{% set CHAMBER_TEMP = params.CHAMBER_TEMP | default(40) | float %}
  SET_GCODE_VARIABLE MACRO=_PRINT_VARIABLES VARIABLE=bed_temperature_initial_layer_single VALUE={BED_TEMP}
  SET_GCODE_VARIABLE MACRO=_PRINT_VARIABLES VARIABLE=nozzle_temperature_initial_layer VALUE={EXTRUDER_TEMP}
  #SET_GCODE_VARIABLE MACRO=_PRINT_VARIABLES VARIABLE=chamber_temperature VALUE={CHAMBER_TEMP}

  SET_GCODE_OFFSET Z=0                                      ; reset Z offset
  M220 S100                                                 ; reset speed multiplier
  M221 S100                                                 ; reset flow multiplier
  G21                                                       ; set units to millimeters
  G90                                                       ; use absolute coordinates
  M83                                                       ; use relative extrusion
  G92 E0.0                                                  ; reset extruder

  G28
  M140 S100 						                                    ; homing
  M109 S150				                                    			; prep hotend
  M190 S100					                                      	; prep bed
  BED_MESH_CLEAR			                                			; clear bed mesh
  Z_TILT_ADJUST                                             ; Z_tilt_adjust
  BED_MESH_CALIBRATE										                    ; Bed Mesh
  G0 X90 Y90 F4800					                              	; centre Position
  G28 Z							                                       	; homing Z
  CARTOGRAPHER_TOUCH_HOME		                          			; Z touch offset
 
  G0 X10 Y10 Z10 F4800					                          	; starting point
  M190 S{BED_TEMP}					                               	; set bed temp
  M109 S{EXTRUDER_TEMP}                     			       		; set nozzle temp 
  PURGE_LINE										                        		; purging
  M117 													                          	; Printing


[gcode_macro PURGE_LINE]
gcode:
	#G90                  
   # G1 Z10 F6000
   # G1 X10 Y10 F12000
   # G1 Z0.5 F600
   # G1 Y105 E10 F1000
   # G1 Y115 E2.5 F1000
   # G92 E0.0 

  G90
	G1 X8 Y8 Z0.4 F8000
	
	G91
	G1 E13 F200
	G1 Y20 E3 F1200
	
	G1 Y120 E27 F1200
	G1 X0.8
	G1 Y-10 E2 F1200
	G1 X0.8
	
	G92 E0.0  
  G90

[gcode_macro PRINT_END]
gcode: 
	RESPOND MSG="Done"

	BED_MESH_CLEAR
	
	M400
	G91
	
	G1 E-0.5 F3600
	
	{% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
	{% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
	{% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
	
	{% if printer.toolhead.position.x < (max_x - 20) %}
	{% set x_safe = 20.0 %}
	{% else %}
	{% set x_safe = -20.0 %}
	{% endif %}
	
	{% if printer.toolhead.position.y < (max_y - 20) %}
	{% set y_safe = 20.0 %}
	{% else %}
	{% set y_safe = -20.0 %}
	{% endif %}
	
	{% if printer.toolhead.position.z < (max_z - 50) %}
	{% set z_safe = 50.0 %}
	{% else %}
	{% set z_safe = max_z - printer.toolhead.position.z %}
	{% endif %}
	
	G0 X{x_safe} Y{y_safe} Z{z_safe} F30000
	
	SET_GCODE_OFFSET Z=0
	TURN_OFF_HEATERS
	
	G92 E0
	M107

