#IDM Cartographer

[cartographer]
mcu: cartographer
x_offset: -32.5  #-31.6	                # adjust for your cartographers offset from nozzle to middle of coil
y_offset: 0   			                # adjust for your cartographers offset from nozzle to middle of coil
verbose: no                             # For extra output
#backlash_comp: 0.5 		            # Backlash compensation distance for removing Z backlash before measuring the sensor response.
#calibration_method: touch              # Leave this as "touch" unless you want to use "scan only" for everything.
#cartographer_touch_z_offset: 0.0425    # This is the default and will be overwritten and added to the DO NOT SAVE area by using the UI to save Z offset.
#sensor: cartographer  	                # this must be set as cartographer unless using IDM etc.
#sensor_alt: cartographer_touch		    # alternate name to call commands. CARTO_TOUCH etc      
#mesh_runs: 2			                # Number of passes to make during mesh scan.


#[safe_z_home]
#home_xy_position: 90, 90
#z_hop: 10
