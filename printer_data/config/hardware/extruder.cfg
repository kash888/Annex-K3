[extruder]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14

rotation_distance: 22.00
gear_ratio: 50:6
microsteps: 16
full_steps_per_rotation: 200

nozzle_diameter: 0.500
pressure_advance: 0.0008
pressure_advance_smooth_time: 0.040
filament_diameter: 1.750	
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 120.0
max_extrude_only_accel: 1500.0
max_extrude_cross_section: 20000.0

#pressure_advance_model: tanh
#linear_advance: 0
#nonlinear_offset: 0
#linearization_velocity: 1
#pressure_advance_smooth_time: 0.02 

#pressure_advance: 0.0
#   The amount of raw filament to push into the extruder during extruder acceleration. An equal amount of filament is retracted
#   during deceleration. It is measured in millimeters per millimeter/second. The default is 0, which disables pressure advance.
#pressure_advance_smooth_time: 0.040
#   A time range (in seconds) to use when calculating the average extruder velocity for pressure advance. A larger value results in
#   smoother extruder movements. This parameter may not exceed 200ms.This setting only applies if pressure_advance is non-zero. The default is 0.040 (40 milliseconds).
#instantaneous_corner_velocity: 1.000
#   The maximum instantaneous velocity change (in mm/s) of the extruder during the junction of two moves. The default is 1mm/s.

heater_pin: HE1
max_power: 1.0

sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PF4
min_temp: 0
max_temp: 350

control = pid
pid_kp: 20.705
pid_ki: 1.043
pid_kd: 102.750

[tmc2209 extruder]
uart_pin: PC4
interpolate: false
run_current: 0.552  #0.400 # results in CS17
sense_resistor: 0.110
driver_TBL: 1
driver_TOFF: 3  # 41.7kHz max chopper frequency
driver_HSTRT: 7
driver_HEND: 8